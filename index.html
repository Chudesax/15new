<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Ivan Ilyin" />
    <meta name="description" content="studying project" />
    <title>CPS 1.5</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="css/modern-normalize.min.css" />
    <link rel="stylesheet" href="css/style-min.css" />
  </head>
  <body>
    <section class="repair">
      <div class="repair__header">
        <div class="container">
          <h2 class="repair__title">ремонт техники различных брендов</h2>
        </div>
      </div>
      <div class="container">
        <div class="repair__swiper swiper">
          <ul class="repair__brands swiper-wrapper">
            <li class="repair__brand swiper-slide">
              <button class="repair__brand-btn">
                <img src="img/lenovo.svg" alt="lenovo" />
                <div class="repair__enter"></div>
              </button>
            </li>
            <li class="repair__brand swiper-slide">
              <button class="repair__brand-btn">
                <img src="img/samsung.svg" alt="samsung" />
                <div class="repair__enter"></div>
              </button>
            </li>
            <li class="repair__brand swiper-slide">
              <button class="repair__brand-btn">
                <img src="img/apple.svg" alt="apple" />
                <div class="repair__enter"></div>
              </button>
            </li>
            <li class="repair__brand swiper-slide">
              <button class="repair__brand-btn">
                <img src="img/viewsonic.svg" alt="viewsonic" />
                <div class="repair__enter"></div>
              </button>
            </li>
            <li class="repair__brand swiper-slide">
              <button class="repair__brand-btn">
                <img src="img/bosch.svg" alt="bosch" />
                <div class="repair__enter"></div>
              </button>
            </li>
            <li class="repair__brand swiper-slide">
              <button class="repair__brand-btn">
                <img src="img/hp.svg" alt="hp" />
                <div class="repair__enter"></div>
              </button>
            </li>
            <li class="repair__brand swiper-slide">
              <button class="repair__brand-btn">
                <img src="img/acer.svg" alt="acer" />
                <div class="repair__enter"></div>
              </button>
            </li>
            <li class="repair__brand swiper-slide">
              <button class="repair__brand-btn">
                <img src="img/sony.svg" alt="sony" />
                <div class="repair__enter"></div>
              </button>
            </li>
            <li class="repair__brand swiper-slide">
              <button class="repair__brand-btn">
                <img src="img/lenovo.svg" alt="lenovo" />
                <div class="repair__enter"></div>
              </button>
            </li>
            <li class="repair__brand swiper-slide">
              <button class="repair__brand-btn">
                <img src="img/samsung.svg" alt="samsung" />
                <div class="repair__enter"></div>
              </button>
            </li>
            <li class="repair__brand swiper-slide">
              <button class="repair__brand-btn">
                <img src="img/apple.svg" alt="apple" />
                <div class="repair__enter"></div>
              </button>
            </li>
          </ul>

          <div class="repair__pagination swiper-pagination"></div>
        </div>
      </div>
    </section>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
